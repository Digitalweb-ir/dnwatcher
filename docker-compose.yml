services:
  app:
    image: ${DOCKER_IMAGE:-digitalnetworkwatcher:latest}
    container_name: dnw-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - DB_PATH=/data/watch.db
      - DEBUG=${DEBUG:-false}
      # Set to false for HTTP-only environments (e.g. local Docker development)
      - FORCE_SECURE_COOKIE=${FORCE_SECURE_COOKIE:-false}
      # Security secrets (must be set in .env)
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
      # Xray binary path inside the container
      - XRAY_BINARY=/usr/local/bin/xray
    volumes:
      - ./data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: dnw-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
      - ./caddy-logs:/var/log/caddy
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

