services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        XRAY_VERSION: ${XRAY_VERSION:-v26.3.27}
    image: digitalnetworkwatcher:latest
    container_name: digitalnetworkwatcher
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - DB_PATH=/data/watch.db
      - DEBUG=${DEBUG:-false}
      # تنظیم برای کوکی در محیط‌های HTTP (مثل local development در Docker)
      - FORCE_SECURE_COOKIE=false
      # ----- امنیتی (باید در .env تنظیم شوند) -----
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
      # ----- Xray (اختیاری) -----
      - XRAY_BINARY=/usr/local/bin/xray
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

# نکته: برای تولید، مطمئن شوید .env با مقادیر واقعی وجود دارد.
# مثال اجرا:
#   ENCRYPTION_KEY=$(openssl rand -hex 32) \
#   ADMIN_PASSWORD=StrongPass123 \
#   SESSION_SECRET=$(openssl rand -hex 32) \
#   docker compose up -d